<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Error {{ code }} — NexaBank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .error-box { text-align: center; padding: 3rem; }
    .error-code { font-size: 7rem; font-weight: 700; color: #1e3a8a; line-height: 1; }
    .error-msg  { font-size: 1.25rem; color: #64748b; margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">{{ code }}</div>
    <div class="error-msg">{{ message }}</div>
    <a href="/" class="btn btn-primary mt-4"><i class="bi bi-house-fill me-2"></i>Back to Dashboard</a>
  </div>
</body>
</html>
